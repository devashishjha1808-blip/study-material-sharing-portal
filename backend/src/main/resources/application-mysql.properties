# ===================================================================
# Production / Docker MySQL Profile Configuration
# Activated with: --spring.profiles.active=mysql
# ===================================================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/studymaterial_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root_password_123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
