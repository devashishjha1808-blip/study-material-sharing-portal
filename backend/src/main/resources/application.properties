# ===================================================================
# Spring Boot Main Configuration (Default: Development / H2 In-Memory)
# ===================================================================

server.port=8080
spring.application.name=study-material-sharing-portal

# In-Memory H2 Database (Instant startup for evaluation & testing)
spring.datasource.url=jdbc:h2:mem:studyportal_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (Access at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate Configuration (Experiment 7)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration (Experiment 8)
# Environment variable fallback ensures security compliance
studyportal.jwt.secret=${JWT_SECRET:study_material_super_secret_jwt_key_at_least_256_bits_length_12345}
studyportal.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# File Upload Limit
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB
